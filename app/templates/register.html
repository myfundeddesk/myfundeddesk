<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MyFundedDesk | Institutional Prop Firm</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Ambient Glowing Background -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 my-8">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center gap-3 bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-2xl shadow-xl backdrop-blur-md mb-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-blue-500/30 text-white font-black text-lg">
                    ▲
                </div>
                <div class="text-left">
                    <div class="font-black text-white tracking-wider text-base leading-none">MyFundedDesk</div>
                    <div class="text-[9px] tracking-widest uppercase font-bold text-emerald-400">Funded Traders</div>
                </div>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Create Trader Account</h1>
            <p class="text-xs text-slate-400 mt-1">Start your journey to manage up to ₹200,000 in funded capital.</p>
        </div>

        <!-- Registration Card -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl">
            {% if error %}
            <div class="mb-5 p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs font-semibold text-rose-400 flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Google OAuth -->
            <a href="/auth/google/login" class="w-full flex items-center justify-center gap-2 bg-white hover:bg-slate-50 text-slate-900 font-bold py-3 px-4 rounded-xl transition-colors mb-4 border border-slate-200">
                <svg viewBox="0 0 24 24" class="w-5 h-5">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign up with Google
            </a>

            <div class="flex items-center gap-4 mb-4">
                <div class="flex-1 h-px bg-slate-700"></div>
                <div class="text-xs text-slate-400 font-medium">OR EMAIL</div>
                <div class="flex-1 h-px bg-slate-700"></div>
            </div>

            <form action="/register" method="POST" class="space-y-3.5">
                <input type="hidden" name="next" value="{{ next }}">

                <div>
                    <label class="text-xs font-bold text-slate-300 block mb-1">Full Legal Name</label>
                    <input type="text" name="full_name" value="{{ full_name or '' }}" required placeholder="Alex Rivera" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-medium text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-300 block mb-1">Email Address</label>
                    <input type="email" name="email" value="{{ email or '' }}" required placeholder="alex@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-medium text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-300 block mb-1">Create Password (Min 6 chars)</label>
                    <input type="password" name="password" required placeholder="••••••••" minlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-medium text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-300 block mb-1">Confirm Password</label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" minlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-medium text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 via-teal-500 to-blue-600 hover:opacity-95 text-white font-extrabold py-3.5 px-4 rounded-xl text-sm shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        <span>Register & Launch Dashboard</span>
                    </button>
                </div>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center text-xs text-slate-400 font-medium">
                Already registered? 
                <a href="/login{% if next %}?next={{ next }}{% endif %}" class="text-blue-400 hover:text-blue-300 font-bold ml-1">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
