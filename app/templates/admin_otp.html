<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Verification - {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-300 font-['Inter'] min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#1e293b] border border-slate-700 rounded-2xl shadow-2xl overflow-hidden relative">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
        
        <div class="p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-black text-white mb-2">Security Verification</h1>
                <p class="text-slate-400 text-sm">We've sent a 6-digit verification code to the admin email address.</p>
            </div>

            {% if error %}
            <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-4 rounded-xl text-sm mb-6 text-center font-semibold">
                {{ error }}
            </div>
            {% endif %}

            <form action="/admin/otp" method="POST" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">One-Time Password</label>
                    <input type="text" name="otp" required maxlength="6"
                           class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-mono text-center text-2xl tracking-[0.5em]"
                           placeholder="000000">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-lg shadow-blue-500/20">
                    Verify & Login
                </button>
            </form>
        </div>
    </div>

</body>
</html>
