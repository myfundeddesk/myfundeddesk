<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MyFundedDesk | Institutional Prop Firm</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Ambient Glowing Background -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 my-8">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center gap-3 bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-2xl shadow-xl backdrop-blur-md mb-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-blue-500/30 text-white font-black text-lg">
                    ▲
                </div>
                <div class="text-left">
                    <div class="font-black text-white tracking-wider text-base leading-none">MyFundedDesk</div>
                    <div class="text-[9px] tracking-widest uppercase font-bold text-emerald-400">Funded Traders</div>
                </div>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Create Trader Account</h1>
            <p class="text-xs text-slate-400 mt-1">Start your journey to manage up to ₹200,000 in funded capital.</p>
        </div>

                <!-- Verification Card -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-white mb-2 tracking-tight">Check your email</h1>
                <p class="text-slate-400 font-medium">We've sent a 6-digit verification code to <span class="font-bold text-emerald-400">{{ email }}</span>.</p>
            </div>

            {% if error %}
            <div class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm font-bold flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                {{ error }}
            </div>
            {% endif %}

            <form action="/forgot-password" method="POST" class="space-y-5">
                <input type="hidden" name="email" value="{{ email }}">
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Verification Code</label>
                    <input type="text" name="email" type="email" required class="w-full px-4 py-3 bg-slate-950/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all outline-none font-mono text-center text-2xl tracking-widest placeholder:text-slate-700 text-white" placeholder="trader@example.com" maxlength="6">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-90 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2 mt-4">
                    Verify & Continue
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-8 text-center text-sm font-medium text-slate-400">
                Didn't receive the email? <a href="/register" class="text-blue-500 hover:text-blue-400 font-bold ml-1">Try again</a>
            </div>
        </div>    </div>
</body>
</html>
